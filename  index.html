<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Профиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #18181c;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a30;
            position: relative;
        }

        .banner {
            width: 100%;
            height: 180px;
            background-image: url('3386.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .banner::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), #18181c);
        }

        .profile-content {
            padding: 20px;
            text-align: center;
            position: relative;
            margin-top: -50px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #18181c;
            object-fit: cover;
            background-color: #2a2a30;
        }

        .status-badge {
            display: inline-block;
            background: rgba(255, 75, 75, 0.15);
            color: #ff4b4b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 12px 0 16px 0;
            border: 1px solid rgba(255, 75, 75, 0.3);
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-tiktok {
            background-color: #25F4EE;
            color: #000000;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
        }

        .footer-secret {
            margin-top: 25px;
            font-size: 0.7rem;
            color: #3a3a42;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Баннер -->
        <div class="banner"></div>

        <div class="profile-content">
            <!-- Аватар -->
            <img src="3386.jpg" alt="Профиль" class="avatar">

            <!-- Статус -->
            <div>
                <span class="status-badge">Не в отношениях 🚫</span>
            </div>

            <!-- Социальные сети -->
            <div class="social-links">
                <a href="https://www.tiktok.com/@nurwx07" target="_blank" class="btn btn-tiktok">
                    TikTok: @nurwx07
                </a>
                <a href="https://instagram.com/nurwxz3" target="_blank" class="btn btn-instagram">
                    Instagram: @nurwxz3
                </a>
                <a href="https://wa.me/77471093562" target="_blank" class="btn btn-whatsapp">
                    WhatsApp: +7 747 109 3562
                </a>
            </div>

            <!-- Скрытая дата рождения -->
            <div class="footer-secret">
                28.10.2012 А
            </div>
        </div>
    </div>

</body>
</html>
